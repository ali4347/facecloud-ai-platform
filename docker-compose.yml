version: "3.9"

# FaceCloud — Local Development Infrastructure
# Provides PostgreSQL 16 and Redis 7 for local backend development.
# Supabase MCP is NOT required. Use this Docker setup instead.

services:
  postgres:
    image: postgres:16-alpine
    container_name: facecloud_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facecloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facecloud}
      POSTGRES_DB: ${POSTGRES_DB:-facecloud_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - facecloud_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facecloud} -d ${POSTGRES_DB:-facecloud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: facecloud_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - facecloud_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: facecloud_postgres_data
  redis_data:
    name: facecloud_redis_data

networks:
  facecloud_network:
    name: facecloud_network
    driver: bridge
