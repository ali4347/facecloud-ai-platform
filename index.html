    <script type="application/ld+json">
    {

    <!-- FAQPage Schema: keep in step with FAQ_ITEMS in src/pages/Landing.tsx (structured data must match the visible answers) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What image formats are supported?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "FaceCloud accepts JPEG, PNG, and WebP image formats. ZIP archives containing these formats are also supported for batch processing."
          }
        },
        {
          "@type": "Question",
          "name": "How is my data secured?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "All uploads are encrypted at rest using AES-256 and in transit via TLS 1.3. JWT-based authentication enforces role-based access control across all API endpoints."
          }
        },
        {
          "@type": "Question",
          "name": "Can I delete my data?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Users can delete individual images or entire person folders from the dashboard at any time. Deleted data is permanently removed from all storage systems within 24 hours."
          }
        },
        {
          "@type": "Question",
          "name": "What happens to rejected images?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Images that fail quality checks (blur, exposure, or face detection) are flagged for moderator review. Moderators can override rejections or confirm the automated decision."
          }
        },
        {
          "@type": "Question",
          "name": "Is there an API for integrations?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "API access for integrations is planned together with paid plans, in a later version. Interactive API documentation is generated from the backend."
          }
        },
        {
          "@type": "Question",
          "name": "What are the plan limits?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Plans, pricing and limits are coming in a later version, so the figures on the pricing cards are not final and are not enforced yet."
          }
        }
      ]
    }
    </script>
